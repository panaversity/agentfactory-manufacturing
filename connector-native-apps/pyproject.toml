[project]
name = "connector-app"
version = "0.1.0"
description = "Connector-Native Apps crash course — minimal base (you build the gateway on top)"
requires-python = ">=3.14"
# Only the deps the GIVEN code needs ship here: the token check (auth.py) and the local mock
# sign-in (mock_auth). You ADD the rest as you build, against their current versions:
#   uv add fastmcp            # Concept 4, the gateway  (verify the API via Context7 first)
#   uv add "psycopg[binary]"  # Concept 5, the two-table store
#   uv add python-dotenv      # when server.py loads .env
# Floors, not pins. When Context7 / live docs disagree with anything here, the live docs win.
dependencies = [
    "python-jose[cryptography]>=3.3",  # JWT validation in auth.py / session.py (pulls cryptography)
    "httpx>=0.27",                     # fetch the authorization server's JWKS
]

[project.optional-dependencies]
# Beginner track only: the local mock sign-in service (mock_auth/).
mock-auth = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "pytest>=8.0",  # the five security-core smoke tests in tests/
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/connector_app"]
