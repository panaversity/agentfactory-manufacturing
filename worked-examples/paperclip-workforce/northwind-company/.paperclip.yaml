schema: "paperclip/v1"
agents:
  ceo:
    role: "ceo"
    icon: "crown"
    capabilities: "Reads the company goal, proposes a strategy for board approval, then creates and delegates tasks to its reports."
    adapter:
      config:
        model: "openai/gpt-5.4-mini"
      type: "opencode_local"
    runtime:
      heartbeat:
        intervalSeconds: 300
        maxConcurrentRuns: 1
    permissions:
      canCreateAgents: true
    budgetMonthlyCents: 100
  cmo:
    role: "cmo"
    icon: "mail"
    capabilities: "Owns newsletter positioning, landing page copy, distribution plans, and growth experiments for Northwind."
    adapter:
      config:
        model: "openai/gpt-5.4-mini"
      type: "opencode_local"
company:
  attachmentMaxBytes: 10485760
  requireBoardApprovalForNewAgents: true
projects:
  northwind-site:
    color: "#6366f1"
    status: "planned"
sidebar:
  agents:
    - "ceo"
    - "cmo"
  projects:
    - "northwind-site"
